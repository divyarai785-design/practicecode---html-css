<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Marks table</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f7f7;
        }

        .outer-box {
            width: 600px;
            margin: 40px auto;
            padding: 25px;
            border: 3px solid #000;
            border-radius: 35px;
        }

        .outer-box-inner {
            border: 2px dotted #000;
            border-radius: 30px;
            padding: 30px 25px 40px;
        }

        .title-box {
            border: 2px solid #000;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            margin-bottom: 35px;
        }

        .title-box h1 {
            margin: 0;
            font-size: 28px;
        }

        .table-box {
            border: 2px solid #000;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th,
        td {
            padding: 10px 0;
            border-left: 3px solid #000;
            border-right: 3px solid #000;
        }

        th:first-child,
        td:first-child {
            border-left: none;
        }

        th:last-child,
        td:last-child {
            border-right: none;
        }

        th {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="outer-box">
        <div class="outer-box-inner">
            <div class="title-box">
                <h1>Marks table</h1>
            </div>

            <div class="table-box">
                <table>
                    <tr>
                        <th>student</th>
                        <th>Maths</th>
                        <th>Physics</th>
                        <th>Computer<br>Science</th>
                    </tr>
                    <tr>
                        <td>Name</td>
                        <td>54</td>
                        <td>32</td>
                        <td>23</td>
                    </tr>
                    <tr>
                        <td>Name</td>
                        <td>54</td>
                        <td>32</td>
                        <td>23</td>
                    </tr>
                    <tr>
                        <td>Name</td>
                        <td>54</td>
                        <td>32</td>
                        <td>23</td>
                    </tr>
                    <tr>
                        <td>Name</td>
                        <td>54</td>
                        <td>32</td>
                        <td>23</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>

</body>

</html>
